services:
  postgres:
    image: postgres:16
    container_name: pokehub-postgres
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pokehub-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pokemon
      SPRING_DATASOURCE_USERNAME: pokemon
      SPRING_DATASOURCE_PASSWORD: pokemon
    ports:
      - "8080:8080"

volumes:
  pgdata:
