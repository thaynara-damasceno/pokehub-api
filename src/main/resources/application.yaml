spring:
  application:
    name: pokehub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/pokemon
    username: pokemon
    password: pokemon
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
