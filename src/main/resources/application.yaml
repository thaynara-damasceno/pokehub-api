spring:
  application:
    name: pokehub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/pokemon
    username: pokemon
    password: pokemon
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
  cache:
    ttl-seconds: 300
    max-size: 500
pokehub:
  jwt:
    secret: ${JWT_SECRET:pokehub-demo-secret-change-me-0123456789}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  seed:
    enabled: true
    username: demo
    password: demo-password-123
